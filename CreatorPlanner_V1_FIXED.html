<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Creator Planner</title>
<style>
:root{--bg:#f4f5f7;--card:#fff;--text:#17181c;--muted:#70757d;--line:#e7e8eb;--accent:#111827;--green:#16803c;--red:#c62828;--orange:#b45309}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
header{background:var(--accent);color:#fff;padding:22px 16px 20px;position:sticky;top:0;z-index:5}
header h1{margin:0;font-size:23px}.sub{margin-top:5px;opacity:.72;font-size:13px}
main{max-width:850px;margin:auto;padding:14px 14px 90px}
nav{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-bottom:14px}
nav button{border:0;background:#fff;padding:11px 5px;border-radius:12px;font-weight:700;font-size:12px;color:#333;cursor:pointer;touch-action:manipulation;position:relative;z-index:10}
nav button.active{background:#111827;color:#fff}
.view{display:none}.view.active{display:block}
.hero{background:#111827;color:#fff;border-radius:18px;padding:18px;margin-bottom:12px}
.hero .label{font-size:13px;opacity:.75}.hero .days{font-size:34px;font-weight:800;margin:5px 0}.hero .msg{font-size:13px}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px}
.channel{min-height:130px}.name{font-weight:800;font-size:15px}.count{font-size:27px;font-weight:800;margin:10px 0 3px}.muted{color:var(--muted);font-size:12px}
.green{color:var(--green)}.red{color:var(--red)}.orange{color:var(--orange)}
.section-title{font-size:17px;font-weight:800;margin:17px 2px 9px}
.item{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}.topic{font-weight:700;font-size:14px}.meta{font-size:12px;color:var(--muted);margin-top:3px}
.pill{font-size:11px;font-weight:800;padding:6px 8px;border-radius:20px;background:#eef7f0;color:var(--green);white-space:nowrap}
button.primary{background:#111827;color:white;border:0;border-radius:11px;padding:12px 14px;font-weight:800;cursor:pointer;touch-action:manipulation;position:relative;z-index:10}
button.danger{background:#fff0f0;color:var(--red);border:1px solid #ffd0d0;border-radius:10px;padding:8px}
form{display:grid;gap:10px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
input,select,textarea{width:100%;padding:12px;border:1px solid #d7d9dd;border-radius:11px;background:white;font-size:15px}textarea{min-height:80px}
.calendar-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.month{font-weight:800;font-size:18px}
.calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.dow{text-align:center;font-size:10px;color:var(--muted);padding:4px 0}.day{background:#fff;border:1px solid var(--line);min-height:74px;border-radius:9px;padding:6px;font-size:11px}.day.today{outline:2px solid #111827}.num{font-weight:800}.dot{font-size:9px;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.dot.a{color:#5b46d8}.dot.b{color:#b45309}.dot.h{color:#16803c}
.empty{padding:18px;text-align:center;color:var(--muted)}
.batch-row{display:flex;gap:8px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}.batch-row input{flex:1}
.smallbtn{border:0;border-radius:9px;padding:8px 10px;background:#eef0f3;font-weight:700}
@media(max-width:620px){.cards{grid-template-columns:1fr}.grid{grid-template-columns:1fr}.day{min-height:58px;padding:5px}.dot{font-size:8px}}
</style>
</head>
<body>
<header><div style="max-width:850px;margin:auto"><h1>🎯 Creator Planner</h1><div class="sub">Batch → Schedule → Rest</div></div></header>
<main>
<nav>
<button class="active navbtn" data-view="home">🏠 Home</button>
<button class="navbtn" data-view="calendar">📅 Calendar</button>
<button class="navbtn" data-view="add">＋ Add</button>
<button class="navbtn" data-view="batch">📦 Batch</button>
</nav>

<section id="home" class="view active">
<div class="hero"><div class="label">OVERALL CONTENT BUFFER</div><div class="days" id="overall">0 days</div><div class="msg" id="message">Add your real scheduled videos.</div></div>
<div class="cards" id="channels"></div>
<div class="card"><div class="section-title" style="margin-top:0">📌 Next uploads</div><div id="next"></div></div>
</section>

<section id="calendar" class="view">
<div class="card">
<div class="calendar-head"><button class="smallbtn" onclick="moveMonth(-1)">‹</button><div class="month" id="month"></div><button class="smallbtn" onclick="moveMonth(1)">›</button></div>
<div class="calgrid" id="cal"></div>
</div>
</section>

<section id="add" class="view">
<div class="card">
<div class="section-title" style="margin-top:0">＋ Add video</div>
<form onsubmit="addOne(event)">
<select id="channel" required><option>Amygdashift</option><option>AlooToonia</option><option>Historical Theory</option></select>
<input id="topic" placeholder="Topic / title" required>
<div class="grid"><input id="date" type="date" required><input id="time" type="time" value="18:00" required></div>
<button class="primary">Save</button>
</form>
</div>
</section>

<section id="batch" class="view">
<div class="card">
<div class="section-title" style="margin-top:0">📦 Batch schedule</div>
<div class="muted" style="margin-bottom:10px">Topics ko ek-ek line mein paste karo. Dates automatically channel ke schedule ke hisaab se lagengi.</div>
<form onsubmit="makeBatch(event)">
<select id="bchannel"><option>AlooToonia</option><option>Historical Theory</option><option>Amygdashift</option></select>
<input id="bstart" type="date" required>
<textarea id="topics" placeholder="Topic 1&#10;Topic 2&#10;Topic 3&#10;..."></textarea>
<button class="primary">Auto Schedule</button>
</form>
</div>
<div class="card" style="margin-top:12px">
<div class="section-title" style="margin-top:0">Scheduled content</div><div id="list"></div>
</div>
</section>
</main>

<script>
const rules={
"Amygdashift":{days:[3,6],time:"18:00",cls:"a",unit:"uploads"},
"AlooToonia":{days:[0,1,2,3,4,5,6],time:"18:00",cls:"b",unit:"days"},
"Historical Theory":{days:[0,1,2,3,4,5,6],time:"18:00",cls:"h",unit:"days"}
};
let data=JSON.parse(localStorage.getItem("creatorPlannerData")||"[]");
let monthCursor=new Date(); monthCursor.setDate(1);

function save(){localStorage.setItem("creatorPlannerData",JSON.stringify(data));render()}
function tab(id,btn){document.querySelectorAll(".view").forEach(x=>x.classList.remove("active"));document.getElementById(id).classList.add("active");document.querySelectorAll("nav button").forEach(x=>x.classList.remove("active"));btn.classList.add("active");render()}
function addOne(e){e.preventDefault();data.push({id:Date.now(),channel:document.getElementById('channel').value,topic:document.getElementById('topic').value,date:document.getElementById('date').value,time:document.getElementById('time').value});e.target.reset();document.getElementById('time').value='18:00';save();showTab('home')}
function localDate(d){return new Date(d.getFullYear(),d.getMonth(),d.getDate())}
function isFuture(v){return new Date(v.date+"T"+v.time)>=new Date()}
function buffer(ch){return data.filter(v=>v.channel===ch&&isFuture(v)).length}
function scheduleDate(start,ch,index){let d=new Date(start+"T12:00:00"), r=rules[ch], n=-1; while(true){if(r.days.includes(d.getDay())){n++;if(n===index)return d}d.setDate(d.getDate()+1)}}
function makeBatch(e){e.preventDefault();let ch=document.getElementById('bchannel').value,start=document.getElementById('bstart').value;document.getElementById('topics').value.split(/\n+/).map(x=>x.trim()).filter(Boolean).forEach((t,i)=>{let d=scheduleDate(start,ch,i);data.push({id:Date.now()+i,channel:ch,topic:t,date:d.toISOString().slice(0,10),time:rules[ch].time})});e.target.reset();save();tab("home",document.querySelector("nav button"))}
function fmtDate(s){return new Date(s+"T12:00:00").toLocaleDateString("en-IN",{day:"2-digit",month:"short",year:"numeric"})}
function fmtTime(t){let [h,m]=t.split(":");h=+h;return (h%12||12)+":"+m+" "+(h>=12?"PM":"AM")}
function render(){
let counts=Object.keys(rules).map(buffer), min=Math.min(...counts);
document.getElementById("overall").textContent=(data.length?min:0)+" days";
document.getElementById("message").textContent=!data.length?"Add your real scheduled videos.":min>=15?"🟢 Content covered — rest is okay.":min>=5?"🟡 Buffer okay — plan your next batch.":"🔴 Buffer low — batch creation needed.";
document.getElementById("channels").innerHTML=Object.keys(rules).map((ch,i)=>`<div class="card channel"><div class="name">${ch}</div><div class="count ${counts[i]>=5?"green":"red"}">${counts[i]}</div><div class="muted">${ch==="Amygdashift"?"Wed + Sat • 6 PM":"Daily • 6 PM"}</div></div>`).join("");
let up=data.filter(isFuture).sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time)).slice(0,7);
document.getElementById("next").innerHTML=up.length?up.map(v=>`<div class="item"><div><div class="topic">${v.topic}</div><div class="meta">${v.channel} • ${fmtDate(v.date)} • ${fmtTime(v.time)}</div></div><span class="pill">Scheduled</span></div>`).join(""):"<div class='empty'>No scheduled videos yet.</div>";
renderCalendar(); renderList()
}
function renderCalendar(){
let y=monthCursor.getFullYear(),m=monthCursor.getMonth(),first=new Date(y,m,1),days=new Date(y,m+1,0).getDate();
document.getElementById("month").textContent=first.toLocaleDateString("en-IN",{month:"long",year:"numeric"});
let out=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"].map(x=>`<div class="dow">${x}</div>`).join("");
for(let i=0;i<first.getDay();i++)out+="<div></div>";
let today=new Date();today.setHours(0,0,0,0);
for(let d=1;d<=days;d++){let key=`${y}-${String(m+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`, day=new Date(y,m,d);let vs=data.filter(v=>v.date===key);out+=`<div class="day ${day.getTime()===today.getTime()?"today":""}"><div class="num">${d}</div>${vs.slice(0,4).map(v=>`<div class="dot ${rules[v.channel].cls}">• ${v.channel==="Amygdashift"?"Amy":v.channel==="AlooToonia"?"Aloo":"Hist"} ${fmtTime(v.time)}</div>`).join("")}${vs.length>4?`<div class="dot">+${vs.length-4} more</div>`:""}</div>`}
document.getElementById("cal").innerHTML=out
}
function moveMonth(n){monthCursor.setMonth(monthCursor.getMonth()+n);renderCalendar()}
function renderList(){
let el=document.getElementById("list"), arr=[...data].sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));
if(!arr.length){el.innerHTML="<div class='empty'>No videos yet.</div>";return}
el.innerHTML=arr.map(v=>`<div class="item"><div><div class="topic">${v.topic}</div><div class="meta">${v.channel} • ${fmtDate(v.date)} • ${fmtTime(v.time)}</div></div><button class="danger" onclick="del(${v.id})">Delete</button></div>`).join("")
}
function del(id){if(confirm("Delete this video?")){data=data.filter(v=>v.id!==id);save()}}
function showTab(id){
  document.querySelectorAll('.view').forEach(function(x){x.classList.remove('active')});
  var target=document.getElementById(id);
  if(target) target.classList.add('active');
  document.querySelectorAll('.navbtn').forEach(function(x){
    x.classList.toggle('active',x.getAttribute('data-view')===id);
  });
  render();
}
document.querySelectorAll('.navbtn').forEach(function(btn){
  btn.addEventListener('click',function(ev){
    ev.preventDefault();
    ev.stopPropagation();
    showTab(btn.getAttribute('data-view'));
  });
});
render();
</script>
</body>
</html>
